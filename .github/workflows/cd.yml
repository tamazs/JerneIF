name: Deploy to Fly.io

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    name: Deploy client & server to Fly.io
    runs-on: ubuntu-latest
    needs: [client_build_job, server_test_job]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      # Deploy backend (server)
      - name: Deploy server
        run: flyctl deploy --config ./server/fly.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Deploy frontend (client)
      - name: Deploy client
        run: flyctl deploy --config ./client/fly.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
